<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ailsa Studio — 2026 AI Compliance Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --navy:        #00172D;
      --navy-mid:    #001F3D;
      --copper:      #B87333;
      --copper-light:#d4956a;
      --copper-dim:  rgba(184,115,51,0.12);
      --off-white:   #F5F2ED;
      --slate:       #8A9BB0;
      --border:      rgba(184,115,51,0.2);
      --border-sub:  rgba(255,255,255,0.07);
      --green:       #22c55e;
    }
    
    html { scroll-behavior: smooth; }
    
    body {
      background: var(--navy); 
      color: var(--off-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      font-size: 15px;
      line-height: 1.6; 
      overflow-x: hidden;
    }
    
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity:.5;
    }
    
    /* Swapped completely to Playfair Display with strict lining number configuration */
    h1, h2, h3, h4 { 
      font-family: 'Playfair Display', Georgia, serif; 
      font-weight: 700; 
      line-height: 1.15; 
      font-variant-numeric: lining-nums;
    }

    h1 em, .hero h1 em {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 400; /* Original elegant weight for cursive swashes */
      background: linear-gradient(135deg, var(--copper-light), var(--copper));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .container { max-width:1080px; margin:0 auto; padding:0 1.5rem; position:relative; z-index:1; }
    .section { padding:6rem 0; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @keyframes ripple { 0%{transform:scale(0.95);opacity:0.5;} 100%{transform:scale(1.15);opacity:0;} }
    
    .fu  { animation:fadeUp .55s ease both; }
    .fu1 { animation:fadeUp .55s .1s ease both; }
    .fu2 { animation:fadeUp .55s .2s ease both; }
    .fu3 { animation:fadeUp .55s .3s ease both; }
    .fu4 { animation:fadeUp .55s .4s ease both; }

    /* NAV */
    nav {
      position:sticky; top:0; z-index:100;
      border-bottom:1px solid var(--border);
      background:rgba(0,23,45,0.92); backdrop-filter:blur(16px);
      padding:.875rem 0;
    }
    .nav-inner { display:flex; align-items:center; justify-content:space-between; }
    .nav-brand  { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .nav-shield {
      width:30px; height:30px; border-radius:50%;
      border:1.5px solid var(--copper);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:var(--copper);
    }
    .nav-name {
      font-family: 'Playfair Display', serif; font-size:14px; font-weight:700;
      color:var(--off-white); letter-spacing:.08em; text-transform:uppercase; display:block;
      font-variant-numeric: lining-nums;
    }
    .nav-sub { font-size:9px; color:var(--slate); letter-spacing:.07em; text-transform:uppercase; display:block; }
    .btn-nav {
      display:inline-flex; align-items:center; gap:6px; padding:.5rem 1.1rem;
      background:linear-gradient(135deg,var(--copper),var(--copper-light));
      color:var(--navy); border:none; border-radius:6px;
      font-family: 'Inter', sans-serif; font-size:12px; font-weight:600;
      letter-spacing:.05em; cursor:pointer; text-decoration:none; transition:opacity .2s;
    }
    .btn-nav:hover { opacity:.85; }

    /* HERO */
    .hero { padding:6rem 0 5.5rem; position:relative; overflow:hidden; }
    .hero::after {
      content:''; position:absolute; top:-5%; left:50%; transform:translateX(-50%);
      width:700px; height:380px;
      background:radial-gradient(ellipse,rgba(184,115,51,.09) 0%,transparent 65%);
      pointer-events:none;
    }
    .hero-split { display:grid; grid-template-columns:1.15fr 0.85fr; gap:3rem; align-items:center; }
    @media(max-width:900px) { .hero-split { grid-template-columns:1fr; gap:3rem; } .avatar-container { margin:0 auto; } }

    .eyebrow {
      display:inline-flex; align-items:center; gap:8px;
      font-size:10px; font-family: 'Inter', sans-serif;
      color:var(--copper); letter-spacing:.12em; text-transform:uppercase;
      border:1px solid var(--border); background:var(--copper-dim);
      padding:4px 14px; border-radius:20px; margin-bottom:1.75rem;
    }
    .eyebrow-dot { width:6px; height:6px; border-radius:50%; background:var(--copper); animation:pulseDot 2s infinite; }
    .hero h1 {
      font-size:clamp(2.4rem,4.5vw,3.6rem); font-weight:700;
      color:var(--off-white); margin-bottom:1.4rem; letter-spacing:-.01em;
    }
    .hero-sub { font-size:16px; color:var(--slate); line-height:1.75; margin-bottom:2.2rem; }
    .hero-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    
    .btn-primary {
      display:inline-flex; align-items:center; gap:8px; padding:.9rem 2rem;
      background:linear-gradient(135deg,var(--copper),var(--copper-light));
      color:var(--navy); border:none; border-radius:8px;
      font-family: 'Inter', sans-serif; font-size:14px; font-weight:600;
      letter-spacing:.04em; cursor:pointer; text-decoration:none;
      box-shadow:0 4px 28px rgba(184,115,51,.32); transition:opacity .2s, transform .2s;
    }
    .btn-primary:hover { opacity:.87; transform:translateY(-1px); }
    .btn-ghost {
      display:inline-flex; align-items:center; gap:8px; padding:.9rem 1.75rem;
      background:transparent; color:var(--off-white);
      border:1px solid rgba(255,255,255,.13); border-radius:8px;
      font-family: 'Inter', sans-serif; font-size:14px; font-weight:500;
      cursor:pointer; text-decoration:none; transition:border-color .2s, background .2s;
    }
    .btn-ghost:hover { border-color:var(--copper); background:var(--copper-dim); }
    
    /* AVATAR INTERACTIVE LAYER - COMPLETELY EXPOSED & SHARP */
    .avatar-container { position:relative; width:100%; max-width:380px; aspect-ratio:4/5; }
    .avatar-ripple {
      position:absolute; inset:-4px; border-radius:20px; border:2px solid var(--copper);
      opacity:0; pointer-events:none; z-index:0;
    }
    .avatar-container.playing .avatar-ripple { animation:ripple 2s infinite ease-out; }
    
    .avatar-frame {
      width:100%; height:100%; position:relative; z-index:2; cursor:pointer;
      border:1px solid rgba(184,115,51,0.15); border-radius:16px;
    }
    .avatar-img { 
      width:100%; height:100%; object-fit:cover; display:block; border-radius:15px;
    }
    
    /* Floating absolute tags that completely avoid blocking her jacket lapels */
    .avatar-badge {
      position:absolute; top:1rem; left:1rem;
      display:inline-flex; align-items:center; gap:6px; background:rgba(0,23,45,0.85);
      border:1px solid var(--border); padding:6px 12px; border-radius:30px;
      font-size:11px; font-weight:600; color:var(--off-white); letter-spacing:0.04em;
      backdrop-filter:blur(4px); z-index:3;
    }
    .avatar-badge::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--copper); }
    .avatar-container.playing .avatar-badge::before { background:var(--green); animation:pulseDot 1s infinite; }
    
    /* Semi-transparent control capsule floating neatly over the bottom artwork boundary */
    .avatar-control-capsule {
      position:absolute; bottom:1rem; left:1rem; right:1rem;
      background:rgba(0,23,45,0.8); border:1px solid var(--border);
      padding:0.75rem 1rem; border-radius:12px; backdrop-filter:blur(8px);
      z-index:3; display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .avatar-title { font-family: 'Playfair Display', serif; font-size:1.05rem; color:var(--off-white); font-weight:700; }
    .avatar-prompt { font-size:11px; color:var(--copper-light); font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }

    .trust-row { margin-top:2.5rem; display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; border-top:1px solid var(--border-sub); padding-top:1.5rem; }
    .trust-item { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--slate); }
    .trust-tick { color:var(--green); }

    /* STATS */
    .stats-bar {
      border-top:1px solid var(--border-sub); border-bottom:1px solid var(--border-sub);
      background:rgba(255,255,255,.02); padding:2rem 0;
    }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1.5rem; text-align:center; }
    .stat-v { font-family: 'Playfair Display', serif; font-size:2rem; font-weight:900; color:var(--copper); display:block; font-variant-numeric: lining-nums; }
    .stat-l { font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing: .08em; }

    /* SECTION HDR */
    .sec-eye { font-size:10px; font-family: 'Inter', sans-serif; color:var(--copper); letter-spacing:.12em; text-transform:uppercase; margin-bottom:.6rem; display:block; }
    .sec-title { font-size:clamp(1.6rem,3.5vw,2.4rem); font-weight:700; color:var(--off-white); margin-bottom:1rem; max-width:600px; }
    .sec-body  { font-size:15px; color:var(--slate); max-width:500px; line-height:1.75; }

    /* ASSETS GRID */
    .assets-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:1.5rem; margin-top:3rem; }
    .asset-card {
      background:rgba(255,255,255,.02); border:1px solid var(--border-sub);
      border-radius:12px; padding:1.75rem; position:relative; overflow:hidden;
      transition:border-color .25s, background .25s, transform .2s;
    }
    .asset-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,var(--copper),var(--copper-light));
      opacity:0; transition:opacity .25s;
    }
    .asset-card:hover { border-color:var(--border); background:rgba(184,115,51,.04); transform:translateY(-2px); }
    .asset-card:hover::before { opacity:1; }
    .asset-num { font-size:9px; font-family: 'Inter', sans-serif; color:var(--copper); letter-spacing:.12em; text-transform:uppercase; margin-bottom:.85rem; display:block; font-variant-numeric: lining-nums; }
    .asset-icon { width:38px; height:38px; border-radius:8px; background:var(--copper-dim); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:.9rem; }
    .asset-card h3 { font-size:1.05rem; font-weight:700; color:var(--off-white); margin-bottom:.45rem; }
    .asset-card p  { font-size:13px; color:var(--slate); line-height:1.65; margin-bottom:1rem; }
    .badge { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-family: 'Inter', sans-serif; padding:3px 10px; border-radius:4px; font-weight:600; letter-spacing:.04em; }
    .badge-a { background:#3b1f00; color:#f59e0b; }
    .badge-b { background:#1e3a5f; color:#60a5fa; }
    .badge-c { background:#1a1051; color:#a78bfa; }
    .badge-d { background:#0d3320; color:#4ade80; }

    /* GRADER STRIP */
    .grader-strip {
      background:linear-gradient(135deg,rgba(184,115,51,.08),rgba(184,115,51,.03));
      border:1px solid var(--border); border-radius:14px; padding:2.25rem 2.5rem;
      display:flex; align-items:center; justify-content:space-between; gap:2rem; flex-wrap:wrap; margin-top:4rem;
    }
    .grader-strip h3 { font-size:1.35rem; color:var(--off-white); margin-bottom:.45rem; }
    .grader-strip p  { font-size:13px; color:var(--slate); max-width:400px; }
    .score-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:1.1rem; }
    .score-chip { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-family: 'Inter', sans-serif; padding:4px 12px; border-radius:6px; font-weight:500; font-variant-numeric: lining-nums; }
    .sc-g { background:rgba(34,197,94,.1); color:#22c55e; border:1px solid rgba(34,197,94,.2); }
    .sc-a { background:rgba(245,158,11,.1); color:#f59e0b; border:1px solid rgba(245,158,11,.2); }
    .sc-r { background:rgba(239,68,68,.1); color:#ef4444; border:1px solid rgba(239,68,68,.2); }

    /* PURCHASE */
    .purchase-bg { background:rgba(255,255,255,.01); }
    .purchase-grid { display:grid; grid-template-columns
